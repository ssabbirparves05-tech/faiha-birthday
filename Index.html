<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Faiha ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#0f172a,#1e293b,#7f1d1d,#881337);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:700px;
padding:30px;
text-align:center;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:25px;
color:white;
box-shadow:0 0 30px rgba(255,255,255,.15);
z-index:2;
}

img{
width:260px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 0 25px rgba(255,255,255,.25);
}

h1{
color:#ffb6c1;
font-size:2.3rem;
margin-bottom:10px;
}

#typing{
font-size:1.1rem;
line-height:1.9;
min-height:220px;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
cursor:pointer;
margin-top:20px;
font-size:16px;
background:#ff4d6d;
color:white;
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
font-size:20px;
animation:float 8s linear infinite;
opacity:.8;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120px);
opacity:0;
}
}

.footer{
margin-top:15px;
color:#ffc0cb;
font-style:italic;
}

</style>
</head>

<body>

<div class="card">

<img src="faiha.jpg">

<h1>Happy Birthday Faiha Akhter 🎂</h1>

<div id="typing"></div>

<button onclick="playMusic()">
🎵 Play Music
</button>

<div class="footer">
— A Silent Admirer ❤️
</div>

</div>

<audio id="music">
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const text = `

শুভ জন্মদিন, Faiha ❤️

তোমাকে নিয়ে অনেক কথা লেখা যায়,
কিন্তু কিছু অনুভূতি শব্দের চেয়ে
নীরবতাতেই বেশি সুন্দর লাগে।

তুমি জানো কি জানো না,
কারও দিনের সবচেয়ে সুন্দর
চিন্তাগুলোর একটি তুমি।

তোমার জীবনের প্রতিটি দিন
সুখ, সফলতা ও হাসিতে ভরে উঠুক।

আজকের দিনটা হোক
তোমার জীবনের সবচেয়ে সুন্দর দিনগুলোর একটি।

`;

let i=0;

function typeWriter(){

if(i<text.length){

document.getElementById("typing").innerHTML += text.charAt(i);

i++;

setTimeout(typeWriter,40);

}

}

typeWriter();

function playMusic(){
document.getElementById("music").play();
}

for(let i=0;i<30;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=
(Math.random()*5+5)+"s";

heart.style.fontSize=
(Math.random()*20+15)+"px";

document.body.appendChild(heart);

}

</script>

</body>
</html>
